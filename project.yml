name: SanpoRoad
options:
  bundleIdPrefix: com.tanuki276
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  SanpoRoad:
    type: application
    platform: iOS
    sources:
      - path: SanpoRoad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanuki276.sanporoad
        PRODUCT_NAME: サンポロード
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: サンポロード
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 散歩した道を地図に記録するため位置情報を使用します。
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
