name: SanpoRoad
options:
  bundleIdPrefix: com.tanuki276
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.4
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  SanpoRoad:
    type: application
    platform: iOS
    sources:
      - path: SanpoRoad
        excludes:
          - Resources
    resources:
      - path: SanpoRoad/Resources
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanuki276.sanporoad
        PRODUCT_NAME: サンポロード
        PRODUCT_MODULE_NAME: SanpoRoad
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SanpoRoad/SanpoRoad.entitlements
        INFOPLIST_FILE: SanpoRoad/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.0.0
  SanpoRoadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SanpoRoadTests
    dependencies:
      - target: SanpoRoad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SanpoRoad:
    build:
      targets:
        SanpoRoad: all
        SanpoRoadTests: [test]
    test:
      targets:
        - SanpoRoadTests
