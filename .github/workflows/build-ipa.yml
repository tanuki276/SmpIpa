name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, values in devices.items() if "iOS" in runtime for d in values if d["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No available iPhone simulator")
          print(phones[0]["udid"])
          ')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Run regression tests
        run: |
          xcodebuild \
            -project SanpoRoad.xcodeproj \
            -scheme SanpoRoad \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-tests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SanpoRoad-TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project SanpoRoad.xcodeproj \
            -scheme SanpoRoad \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/サンポロード.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r SanpoRoad-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SanpoRoad-iPhone-unsigned
          path: SanpoRoad-unsigned.ipa
          if-no-files-found: error
